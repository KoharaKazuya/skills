name: business-message
on:
  push:
    paths: ['business-message/**', '.github/workflows/business-message.yml']
  pull_request:
    paths: ['business-message/**', '.github/workflows/business-message.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: business-message
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: business-message/package-lock.json
      - run: npm ci
      - run: npm test
